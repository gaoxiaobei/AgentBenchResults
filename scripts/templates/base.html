<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>{{ title }}</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{
--bg:#0D0E17;--bg-card:#151724;--bg-elevated:#1C1E2C;--bg-hover:#212436;
--text:#E8E9ED;--text-muted:#9698A5;--text-dim:#5D5F6D;
--border:#252738;--border-light:#32354A;
--accent:#5B8DEF;--accent-hover:#7AA3F3;
--s1:#5B8DEF;--s2:#E8A838;--s3:#4ABF8A;--s4:#A078E8;--s5:#E85D75;--s6:#38B2C8;--s7:#F0A060;--s8:#78C870;
--success:#4ABF8A;--warning:#E8A838;--danger:#E85D75;--neutral:#9698A5;
--radius:8px;--radius-sm:5px;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.55;min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;font-size:14px}
nav{background:var(--bg-card);border-bottom:1px solid var(--border);padding:0 2rem;display:flex;align-items:center;height:52px;gap:1.75rem;position:sticky;top:0;z-index:100}
nav .brand{font-weight:650;font-size:.95rem;color:var(--accent);text-decoration:none;letter-spacing:-.01em}
nav .brand:hover{color:var(--accent-hover)}
nav .nav-links{display:flex;gap:1.25rem;align-items:center}
nav .nav-links a{color:var(--text-muted);text-decoration:none;font-size:.825rem;font-weight:500;transition:color .12s}
nav .nav-links a:hover{color:var(--text)}
nav .nav-links a.active{color:var(--accent)}
nav .nav-spacer{flex:1}
nav .nav-meta{color:var(--text-dim);font-size:.7rem}
main{flex:1;max-width:1280px;width:100%;margin:0 auto;padding:2rem 2rem 3rem}
footer{background:var(--bg-card);border-top:1px solid var(--border);padding:1rem 2rem;text-align:center;color:var(--text-dim);font-size:.7rem}
footer a{color:var(--accent);text-decoration:none}
h1{font-size:1.5rem;font-weight:650;margin-bottom:.35rem;letter-spacing:-.02em}
h2{font-size:.95rem;font-weight:600;margin-bottom:.875rem;color:var(--text-muted);letter-spacing:-.01em}
h3{font-size:.875rem;font-weight:600;margin-bottom:.625rem}
a{color:var(--accent);text-decoration:none}
a:hover{color:var(--accent-hover)}
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:1.5rem;margin-bottom:1.5rem;transition:border-color .15s}
.card:hover{border-color:var(--border-light)}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.25rem}
.card-header h2{margin-bottom:0}
.stat-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:2rem}
.stat-strip .stat{background:var(--bg-card);padding:1.25rem 1.5rem;text-align:center;border:none;border-radius:0}
.stat-value{font-family:'SF Mono','Fira Code','Cascadia Code','Consolas',monospace;font-size:1.625rem;font-weight:600;line-height:1.2;color:var(--accent);letter-spacing:-.03em}
.stat-label{font-size:.7rem;color:var(--text-dim);margin-top:.25rem;text-transform:uppercase;letter-spacing:.07em;font-weight:500}
table{width:100%;border-collapse:collapse;font-size:.825rem}
th,td{text-align:left;padding:.6rem .875rem;border-bottom:1px solid var(--border)}
th{color:var(--text-dim);font-weight:600;font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;background:var(--bg-card);position:sticky;top:52px}
tbody tr:hover td{background:var(--bg-hover)}
td.data{font-family:'SF Mono','Fira Code','Cascadia Code','Consolas',monospace;font-size:.78rem}
.badge{display:inline-block;padding:.1rem .5rem;border-radius:9999px;font-size:.65rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.badge-rl{background:rgba(232,168,56,.15);color:var(--s2)}
.badge-rule{background:rgba(74,191,138,.15);color:var(--s3)}
.badge-eval{background:rgba(91,141,239,.15);color:var(--accent)}
.chart-wrap{position:relative;width:100%;min-height:360px}
.chart-wrap.tall{min-height:460px}
.match-ticker{display:flex;gap:1px;align-items:end;height:32px;margin-bottom:.5rem;overflow:hidden;border-radius:2px}
.match-ticker .tick{flex:1;min-width:2px;max-width:4px;border-radius:1px 1px 0 0;transition:opacity .1s}
.tick-win{background:var(--success);opacity:.85}
.tick-loss{background:var(--danger);opacity:.65}
.tick-draw{background:var(--neutral);opacity:.4}
.match-ticker:hover .tick{opacity:1}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem}
.game-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:.875rem;margin-bottom:2rem}
.game-tile{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:1.125rem 1.25rem;text-decoration:none;color:var(--text);display:block;transition:border-color .15s,background .15s}
.game-tile:hover{border-color:var(--accent);background:var(--bg-hover)}
.game-tile h3{margin-bottom:.375rem;font-size:.925rem}
.game-tile .meta{font-size:.75rem;color:var(--text-dim)}
.agent-list{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:1.5rem}
.agent-chip{display:inline-block;padding:.3rem .75rem;background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius-sm);font-size:.8rem;color:var(--text);text-decoration:none;transition:border-color .12s,background .12s}
.agent-chip:hover{border-color:var(--accent);background:var(--bg-hover)}
.empty-state{text-align:center;padding:3rem 2rem;color:var(--text-dim);font-size:.875rem}
.text-muted{color:var(--text-muted)}.text-dim{color:var(--text-dim)}.text-accent{color:var(--accent)}
.text-success{color:var(--success)}.text-warning{color:var(--warning)}.text-danger{color:var(--danger)}
.text-right{text-align:right}.text-sm{font-size:.75rem}.link-row{cursor:pointer}
.mb-1{margin-bottom:.5rem}.mb-2{margin-bottom:1rem}.mb-3{margin-bottom:1.5rem}
@media(max-width:800px){.grid-2,.stat-strip{grid-template-columns:1fr 1fr}main{padding:1rem}nav{padding:0 1rem;gap:1rem}.game-grid{grid-template-columns:1fr}}
@media(max-width:480px){.stat-strip{grid-template-columns:1fr}.grid-2{grid-template-columns:1fr}nav .nav-meta{display:none}h1{font-size:1.25rem}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
<script src="{{ '../' * depth }}assets/charts.js"></script>
</head>
<body>
<nav>
<a href="{{ '../' * depth }}index.html" class="brand">AgentBench</a>
<div class="nav-links">
<a href="{{ '../' * depth }}index.html" {% if page=='index' %}class="active"{% endif %}>Dashboard</a>
<a href="{{ '../' * depth }}compare.html" {% if page=='compare' %}class="active"{% endif %}>Compare</a>
</div>
<div class="nav-spacer"></div>
<span class="nav-meta">{% if gen_time %}{{ gen_time }}{% endif %}</span>
</nav>
<main>{% block content %}{% endblock %}</main>
<footer>Generated by <a href="https://github.com/SAST-agent/AgentBenchFramework">AgentBenchFrame</a></footer>
</body>
</html>
